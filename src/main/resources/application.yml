server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  application:
    name: post-kg-courier-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jetkiz}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always
      continue-on-error: true

  jackson:
    time-zone: Asia/Bishkek

postkg:
  pickup-hub:
    name: "Аю Гранд (Пункт выдачи ГРНЗ POST.KG)"
    address: "г. Бишкек, ул. Чокана Валиханова, 2"
    lat: 42.8542
    lon: 74.6685
    geofence-radius-meters: 100
  thresholds:
    idle-warning-minutes: 10
    idle-critical-minutes: 20
    signal-lost-minutes: 5
    courier-soft-order-limit: 30

